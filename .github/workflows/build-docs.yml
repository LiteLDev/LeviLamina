on:
  pull_request:
    paths:
      - .github/workflows/build-docs.yml
      - docs/**
      - src/**/*.h
  push:
    paths:
      - .github/workflows/build-docs.yml
      - docs/**
      - src/**/*.h
    branches:
      - '**'
  # levimc-kit (the LeviMC bar, footer, docs engine and the Doxygen header/footer) is published by levimc.org and
  # fetched by `npm ci`: levimc.org triggers this workflow when it publishes a new kit, and the hourly check below
  # catches up otherwise.
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

jobs:
  # On the schedule: build only when levimc.org publishes a kit the live site does not run yet.
  kit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - id: check
        run: |
          want=$(curl -fsSL https://levimc.org/kit/v2/manifest.json | jq -r '"levimc-kit " + .version + "+" + .build')
          have=$(curl -fsSL https://docs.levimc.org/LeviLamina/ | grep -o 'levimc-kit [^"]*' | head -1)
          echo "live: $have · published: $want"
          echo "stale=$([ "$want" != "$have" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build-doxygen:
    needs: kit
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.kit.outputs.stale == 'true') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # the Doxygen header, footer, stylesheets and kit.js are levimc-kit's (docs/main/kit/static/)
      - run: |
          node docs/main/scripts/fetch-kit.mjs --dest docs/main/kit

      - run: |
          git clone --depth 1 --branch v2.4.1 https://github.com/jothepro/doxygen-awesome-css.git docs/api/doxygen-awesome-css

      - run: |
          mkdir -p site/api

      - name: Install Doxygen
        run: |
          wget -qO doxygen.tar.gz https://www.doxygen.nl/files/doxygen-1.16.1.linux.bin.tar.gz
          tar -xzf doxygen.tar.gz
          sudo cp -r doxygen-*/bin/* /usr/local/bin/
          sudo chmod +x /usr/local/bin/doxygen
          doxygen --version

      - run: |
          doxygen docs/api/Doxyfile

      - run: |
          tar -cvf artifact.tar -C site/ .

      - uses: actions/upload-artifact@v7
        with:
          name: doxygen-pages
          path: |
            artifact.tar

  build-docs:
    needs: kit
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.kit.outputs.stale == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/main
    steps:
      - uses: actions/checkout@v7
        with:
          # full history for the "Last updated" dates
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/main/package-lock.json

      - run: |
          npm ci

      # tsc --noEmit over docs.config.ts and the kit (the Vite build strips types without checking them)
      - run: |
          npm run typecheck

      - run: |
          npm run build

      # internal links, anchors and redirects (the Doxygen output under /LeviLamina/api/ is merged below)
      - run: |
          npm run linkcheck

      - run: |
          tar -cvf ../../artifact.tar -C dist/ .

      - uses: actions/upload-artifact@v7
        with:
          name: docs-pages
          path: |
            artifact.tar

  merge:
    needs:
      - build-doxygen
      - build-docs
    if: ${{ !cancelled() && needs.build-doxygen.result == 'success' && needs.build-docs.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Extract artifacts
        run: |
          mkdir site
          tar -xvf artifacts/doxygen-pages/artifact.tar -C site/
          tar -xvf artifacts/docs-pages/artifact.tar -C site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    if: ${{ !cancelled() && needs.merge.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs:
      - merge
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
